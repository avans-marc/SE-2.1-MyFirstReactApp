# Builds lesson 05 (the PWA) and publishes it on GitHub Pages:
# https://<owner>.github.io/<repo>/
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "05_pwa/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at the same time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_pwa
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 05_pwa/package-lock.json

      - run: npm ci

      # The app is served from /<repo>/, not from /
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages doesn't know the React routes: a deep link like /cars/renault would be a 404.
      # Serving index.html as the 404 page lets React Router handle it.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: 05_pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
